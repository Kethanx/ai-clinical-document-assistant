name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: aiclinicalacr.azurecr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t $ACR_LOGIN_SERVER/cardiology-api:latest .
          docker push $ACR_LOGIN_SERVER/cardiology-api:latest

      - name: Build and push frontend image
        run: |
          docker build -f Dockerfile.frontend -t $ACR_LOGIN_SERVER/cardiology-frontend:latest .
          docker push $ACR_LOGIN_SERVER/cardiology-frontend:latest

      - name: Build and push worker image
        run: |
          docker build -f Dockerfile.worker -t $ACR_LOGIN_SERVER/cardiology-worker:latest .
          docker push $ACR_LOGIN_SERVER/cardiology-worker:latest
